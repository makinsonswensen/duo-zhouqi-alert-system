# GitHub Actions 定时扫描
# GitHub 的 cron 在高峰期会被延迟甚至直接丢弃（整点前后尤甚），
# 因此改为每 5 分钟触发一次，由 main.py 判断是否处于扫描窗口（--window），
# 并用 --state-dir 做同一根K线去重，保证每小时只真正扫描一次且不漏轮。
# 手动测试：Actions 页面 → 多周期扫描 → Run workflow
name: 多周期扫描

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟；窗口外的触发会秒退，不产生信号
  workflow_dispatch:         # 支持手动触发测试

concurrency:
  group: scan
  cancel-in-progress: false  # 上一次没跑完就排队，不互相打断

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 飞书 webhook 从仓库 Secrets 读取（Settings → Secrets and variables → Actions）
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算本轮K线标识
        id: slot
        # 逻辑需与 main.py 的 resolve_scan_slot 保持一致：
        # 58 分及之后属于本小时K线，之前（已跨整点补扫）属于上一小时K线
        run: |
          MIN=$(TZ=Asia/Shanghai date +%M)
          if [ "$MIN" -ge 58 ]; then
            SLOT=$(TZ=Asia/Shanghai date +%Y%m%d%H)
          else
            SLOT=$(TZ=Asia/Shanghai date -d '-1 hour' +%Y%m%d%H)
          fi
          echo "slot=$SLOT" >> $GITHUB_OUTPUT

      - name: 恢复扫描状态
        # 同一根K线的状态在各次触发间共享，命中缓存即说明该K线已扫过
        uses: actions/cache@v4
        with:
          path: .scan_state
          key: scan-state-${{ steps.slot.outputs.slot }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成运行时配置
        # config.yaml 不入库（含 webhook），用脱敏模板生成；webhook 由环境变量注入
        run: cp config.example.yaml config.yaml

      - name: 执行扫描
        run: python main.py --once --window 12 --state-dir .scan_state

      - name: 失败告警
        # 任一步骤失败时发一条飞书文本消息，避免定时任务静默停止无人察觉
        if: failure()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "⚠️ 未配置 FEISHU_WEBHOOK_URL，跳过失败告警"
            exit 0
          fi
          TEXT="⚠️ 多周期扫描运行失败\n时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')\n仓库: $REPO\n查看日志: $RUN_URL"
          curl -s -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$TEXT\"}}"
          echo "✅ 失败告警已发送"
